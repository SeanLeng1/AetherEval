[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethereval"
version = "0.1.0"
description = "Minimal generative-only LLM evaluation framework with offline vLLM and SGLang backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ray",
  "tqdm",
  "PyYAML",
  "langdetect",
  "nltk",
  "emoji",
  "syllapy",
  "immutabledict",
  "absl-py",
  "math-verify",
  "tiktoken",
  "litellm>=1.93.0,<2",
  "numpy",
]

[project.optional-dependencies]
vllm = ["vllm"]
sglang = ["sglang"]
reward-model = ["sglang", "transformers"]
all-backends = ["vllm", "sglang"]

[project.scripts]
aethereval = "aethereval.cli:main"

[tool.setuptools.packages.find]
include = ["aethereval*", "benchmark_utils*", "benchmarks*"]

[tool.setuptools.package-data]
"aethereval.backends.sglang" = ["encodings/*.tiktoken"]
