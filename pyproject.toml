[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethereval"
version = "0.1.0"
description = "Minimal generative-only LLM evaluation framework with offline vLLM and SGLang backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ray",
  "tqdm",
  "PyYAML",
  "langdetect",
  "nltk",
  "emoji",
  "syllapy==0.8.0",
  "immutabledict",
  "absl-py",
  "math-verify==0.9.0",
  "tiktoken",
  "litellm>=1.93.0,<2",
  "numpy",
]

# EvalPlus is installed separately with --no-deps for scoring only (see README).
# Its generation-provider dependencies conflict with the SGLang Docker stack.

[project.optional-dependencies]
vllm = ["vllm"]
# Floors enforced at worker startup by aethereval.backends.sglang.service.
sglang = ["sglang>=0.5.18", "smg-grpc-servicer>=0.8.0"]
reward-model = ["sglang>=0.5.18", "smg-grpc-servicer>=0.8.0", "transformers"]
all-backends = ["vllm", "sglang>=0.5.18", "smg-grpc-servicer>=0.8.0"]
dynamic = ["datasets", "pyarrow", "huggingface_hub"]
test = ["pytest>=8", "ruff"]

[project.scripts]
aethereval = "aethereval.cli:main"

[tool.setuptools.packages.find]
include = ["aethereval*", "benchmark_utils*", "benchmarks*"]

[tool.setuptools.package-data]
"aethereval.backends.sglang" = ["encodings/*.tiktoken"]
# Keys must be importable names; hyphenated task dirs go in the path.
"benchmarks" = ["creative-writing-v3/prompts/*.txt", "longbench-write/judge.txt", "guidebench/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test this checkout, not whichever one an editable install points at.
pythonpath = ["."]

[tool.ruff]
# Vendored upstream checkers (see their NOTICE files) are kept close to upstream.
extend-exclude = ["benchmarks/ifeval/ifeval_lib", "benchmarks/ifbench/ifbench_lib"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
