run:
  model: "Qwen/Qwen3-0.6B-Base"
  tasks: ["ifeval"]
  inspect: false
  output_dir: "outputs"
  run_id: null
  overwrite: false

runtime:
  backend: "vllm"  # vllm | sglang
  dp_size: 1
  tp_size: 1

generation:
  n: 1
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  min_p: null
  seed: 42
  enable_thinking: null  # true | false | null (preserve checkpoint default)

metrics:
  bootstrap_resamples: 1000
  bootstrap_seed: 42
  bootstrap_confidence: 0.95
  judge_backend: "api"  # api | local
  # Leave judge sampling unset to use each task's aligned defaults.
  judge_model: null
  judge_max_new_tokens: null
  judge_temperature: null
  judge_top_p: null
  judge_enable_thinking: null  # true | false | null (preserve task/backend default)

vllm:
  gpu_memory_utilization: 0.8
  max_model_len: 16384
  dtype: "bfloat16"
  extra_model_kwargs:
    trust_remote_code: true
    max_num_seqs: 512

sglang:
  mem_fraction_static: 0.8
  context_length: 16384
  generation_batch_size: 128
  dtype: "bfloat16"
  extra_model_kwargs:
    trust_remote_code: true
